<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Settings — Contact Automation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { background: #f0f2f5; }
    .navbar { background: #fff; border-bottom: 1px solid #e5e7eb; }
    .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  </style>
</head>
<body>

  <nav class="navbar px-4 py-3 mb-4">
    <span class="fw-bold">Contact Automation</span>
    <div class="ms-auto d-flex gap-3 align-items-center">
      <a href="/dashboard" class="text-decoration-none text-muted">Dashboard</a>
      <a href="/logout" class="text-decoration-none text-danger">Logout</a>
    </div>
  </nav>

  <div class="container" style="max-width: 580px;">
    <h5 class="fw-bold mb-4">Settings</h5>

    {% if success %}
    <div class="alert alert-success py-2">{{ success }}</div>
    {% endif %}
    {% if error %}
    <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}

    <div class="card p-4">
      <h6 class="fw-semibold mb-3">PRPT Credentials</h6>
      <p class="text-muted mb-3" style="font-size:0.875rem;">
        Your Empire Today login. Used to scrape your sales data.
      </p>
      <form method="POST" action="/settings">
        <div class="mb-3">
          <label class="form-label fw-semibold">PRPT Username</label>
          <input type="email" name="prpt_username" class="form-control"
                 value="{{ user.prpt_username }}" placeholder="you@empire-today.com" required/>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">PRPT Password</label>
          <input type="password" name="prpt_password" class="form-control"
                 value="{{ user.prpt_password }}" placeholder="••••••••" required/>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Rep ID</label>
          <input type="text" name="prpt_rep_id" class="form-control"
                 value="{{ user.prpt_rep_id }}" placeholder="e.g. s507821" required/>
          <div class="form-text">Your sales rep ID from the PRPT portal URL.</div>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/dashboard" class="btn btn-link text-muted">Cancel</a>
      </form>
    </div>

    <div class="card p-4 mt-4">
      <h6 class="fw-semibold mb-3">Change Password</h6>
      <form method="POST" action="/settings/change-password">
        <div class="mb-3">
          <label class="form-label fw-semibold">Current Password</label>
          <input type="password" name="current_password" class="form-control" placeholder="••••••••" required/>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">New Password</label>
          <input type="password" name="new_password" class="form-control" placeholder="••••••••" required/>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Confirm New Password</label>
          <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required/>
        </div>
        <button type="submit" class="btn btn-primary">Change Password</button>
      </form>
    </div>
  </div>

</body>
</html>
